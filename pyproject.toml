[project]
name = "repo-readme"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.12.3",
    "numpy>=2.4.6",
    "onnxruntime>=1.27.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "rembg>=2.0.77",
    "requests==2.32.3",
]

[tool.uv]
# pymatting (a rembg dependency) pins an exact numba==0.53.1, which predates
# Python 3.10 support. Override with a numba/llvmlite pair that ships 3.12 wheels.
override-dependencies = ["numba>=0.60", "llvmlite>=0.43"]
